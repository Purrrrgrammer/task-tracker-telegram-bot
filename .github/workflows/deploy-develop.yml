name: Deploy to Development

on:
  push:
    branches:
      - develop
    workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  built-and-deploy:
    runs-on: ubuntu-26.04
    steps:    
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with: 
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/purrrrgrammer/tasktracker-bot:develop
            ghcr.io/purrrrgrammer/tasktracker-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with: 
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd ~/develop
            echo "BOT_TOKEN=${{ secrets.BOT_TOKEN_DEVELOP }}" > .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
            